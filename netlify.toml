[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[scheduled-functions]]
  name = "sync-emails"
  schedule = "0 8,20 * * *"

[[scheduled-functions]]
  name = "fetch-jobs"
  schedule = "0 7 * * 1-5"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  SECRETS_SCAN_OMIT_PATHS = "node_modules,.netlify,docs"
  SECRETS_SCAN_OMIT_KEYS = "MICROSOFT_CLIENT_ID,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,GOOGLE_REDIRECT_URI,MICROSOFT_REDIRECT_URI"
